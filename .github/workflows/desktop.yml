# Builds and tests Downora Desktop on real Windows, macOS and Linux runners.
# Runs only when started by hand (Actions → Desktop → Run workflow) or for a
# `desktop-v*` tag, so it doesn't spend Actions minutes on every push.
#
# Installers are UNSIGNED unless the signing secrets below are configured.
# See apps/desktop/README.md → "Code signing".
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis,msi'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - os: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf ffmpeg

      - run: pnpm install --frozen-lockfile

      # Engine tests (downloads, bridge security, unit). Conversion tests need
      # FFmpeg, which is only installed on the Linux runner.
      - name: Engine tests
        working-directory: apps/desktop
        run: cargo test -p downora-core --lib --test downloads --test bridge
      - name: Conversion tests (FFmpeg)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: cargo test -p downora-core --test convert

      - name: Build installers
        working-directory: apps/desktop
        env:
          # Optional — only used when set (see README → Code signing).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: downora-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/target/**/release/bundle/nsis/*.exe
            apps/desktop/target/**/release/bundle/msi/*.msi
            apps/desktop/target/**/release/bundle/dmg/*.dmg
            apps/desktop/target/**/release/bundle/deb/*.deb
            apps/desktop/target/**/release/bundle/appimage/*.AppImage
