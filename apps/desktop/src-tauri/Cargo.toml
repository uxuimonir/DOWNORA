[package]
description = "Downora desktop app"
name = "downora-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
downora-core = { version = "0.1.0", path = "../crates/core" }
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["sync", "time", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "downora_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Set by `tauri build`: serve the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
