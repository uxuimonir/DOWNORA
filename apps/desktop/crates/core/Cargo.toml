[package]
name = "downora-core"
description = "Downora desktop engine: downloads, FFmpeg conversion and the browser bridge. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net", "signal", "io-std"] }
tokio-util = "0.7.20"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
